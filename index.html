<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA 6 to Retro Pong</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Schriftarten Import */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            user-select: none;
            -webkit-user-select: none;
        }

        /* GTA Startbildschirm Styling */
        #gta-screen {
            background-image: url('bild2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: filter 0.2s ease;
        }

        .gta-text {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 20px rgba(255, 0, 255, 0.8);
            letter-spacing: 2px;
        }

        /* Intensive Glitch / Screen Tearing Effekte */
        .glitch-effect {
            animation: shake 0.2s infinite, glitch-colors 0.1s infinite, tear 0.05s infinite;
            filter: contrast(200%) saturate(300%) hue-rotate(90deg) invert(100%);
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-5px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes glitch-colors {
            0% { filter: hue-rotate(0deg) invert(0%); }
            25% { filter: hue-rotate(90deg) invert(100%); opacity: 0.8;}
            50% { filter: hue-rotate(180deg) invert(0%); opacity: 1;}
            75% { filter: hue-rotate(270deg) invert(100%); opacity: 0.5;}
            100% { filter: hue-rotate(360deg) invert(0%); opacity: 1;}
        }

        @keyframes tear {
            0% { clip-path: polygon(0 0, 100% 0, 100% 10%, 0 10%); transform: translateX(10px); }
            20% { clip-path: polygon(0 20%, 100% 20%, 100% 30%, 0 30%); transform: translateX(-15px); }
            40% { clip-path: polygon(0 40%, 100% 40%, 100% 50%, 0 50%); transform: translateX(20px); }
            60% { clip-path: polygon(0 60%, 100% 60%, 100% 70%, 0 70%); transform: translateX(-10px); }
            80% { clip-path: polygon(0 80%, 100% 80%, 100% 90%, 0 90%); transform: translateX(25px); }
            100% { clip-path: polygon(0 90%, 100% 90%, 100% 100%, 0 100%); transform: translateX(-5px); }
        }

        /* Scanlines Overlay */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Pong Screen */
        #pong-container {
            display: none;
            width: 100%;
            height: 100%;
            background-color: black;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .pong-font {
            font-family: 'Press Start 2P', cursive;
        }

        /* Mobile Controls Overlay */
        #mobile-controls {
            display: none; /* Shows only on touch devices ideally, or handled via full screen touch */
        }
    </style>
</head>
<body>

    <!-- 1. GTA 6 Startbildschirm -->
    <div id="gta-screen" class="absolute inset-0 flex flex-col items-center justify-end pb-24 cursor-pointer z-10">
        <!-- Scanlines effect on top of GTA -->
        <div class="absolute inset-0 scanlines opacity-30"></div>
        
        <h1 class="gta-text text-3xl md:text-5xl lg:text-6xl font-bold text-white animate-pulse mb-8 z-20">
            PRESS 'X' TO START
        </h1>
        <p class="text-white opacity-75 font-sans text-sm md:text-base z-20 hidden md:block">
            oder klicke auf den Bildschirm
        </p>
    </div>

    <!-- Weisser Blitz Overlay -->
    <div id="flash-overlay" class="absolute inset-0 bg-white opacity-0 pointer-events-none z-30 transition-opacity duration-75"></div>

    <!-- 2. Retro Pong Spiel -->
    <div id="pong-container" class="z-0">
        <canvas id="pong-canvas"></canvas>
    </div>

    <script>
        // --- DOM Elements ---
        const gtaScreen = document.getElementById('gta-screen');
        const pongContainer = document.getElementById('pong-container');
        const canvas = document.getElementById('pong-canvas');
        const ctx = canvas.getContext('2d');
        const flashOverlay = document.getElementById('flash-overlay');

        let isTransitioning = false;
        let gameRunning = false;

        // --- Transition Logic (GTA -> Glitch -> Pong) ---
        function triggerGlitch() {
            if (isTransitioning) return;
            isTransitioning = true;

            // 1. Start Glitch Visuals on the GTA Screen
            gtaScreen.classList.add('glitch-effect');
            
            // Random white flashes
            let flashInterval = setInterval(() => {
                flashOverlay.style.opacity = Math.random() > 0.5 ? '0.8' : '0';
            }, 100);

            // 2. End Glitch and show Pong after ~2.5 seconds
            setTimeout(() => {
                clearInterval(flashInterval);
                flashOverlay.style.opacity = '1'; // Final white flash
                
                setTimeout(() => {
                    gtaScreen.style.display = 'none'; // Hide GTA
                    pongContainer.style.display = 'block'; // Show Pong
                    flashOverlay.style.opacity = '0'; // Fade out flash
                    
                    // Initialize and start Pong
                    initPong();
                    gameRunning = true;
                    gameLoop();
                }, 200);

            }, 2500);
        }

        // Event Listeners for starting the transition
        gtaScreen.addEventListener('click', triggerGlitch);
        document.addEventListener('keydown', (e) => {
            if ((e.key === 'x' || e.key === 'X' || e.key === 'Enter') && !isTransitioning) {
                triggerGlitch();
            }
        });

        // --- Pong Game Logic ---
        
        // Game variables
        const paddleWidth = 15;
        let paddleHeight = 100;
        let ballSize = 15;
        
        const player = { x: 0, y: 0, width: paddleWidth, height: paddleHeight, score: 0, dy: 0, speed: 8 };
        const cpu = { x: 0, y: 0, width: paddleWidth, height: paddleHeight, score: 0, speed: 5 };
        const ball = { x: 0, y: 0, size: ballSize, dx: 5, dy: 5, speed: 7 };

        // Key states
        const keys = { w: false, s: false, ArrowUp: false, ArrowDown: false };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Adjust sizes for mobile
            if (canvas.width < 768) {
                paddleHeight = 80;
                ballSize = 10;
                player.width = cpu.width = 10;
            } else {
                paddleHeight = 120;
                ballSize = 15;
                player.width = cpu.width = 15;
            }

            player.height = cpu.height = paddleHeight;
            ball.size = ballSize;

            // Reset positions on resize
            player.x = 20;
            player.y = canvas.height / 2 - player.height / 2;
            cpu.x = canvas.width - 20 - cpu.width;
            cpu.y = canvas.height / 2 - cpu.height / 2;
            
            if(!gameRunning) {
                resetBall();
            }
        }

        window.addEventListener('resize', resizeCanvas);

        function initPong() {
            resizeCanvas();
            resetBall();
            
            // Input Listeners
            document.addEventListener('keydown', (e) => {
                if (keys.hasOwnProperty(e.key)) {
                    keys[e.key] = true;
                }
            });
            
            document.addEventListener('keyup', (e) => {
                if (keys.hasOwnProperty(e.key)) {
                    keys[e.key] = false;
                }
            });

            // Touch support for mobile devices
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault(); // Prevent scrolling
                const touchY = e.touches[0].clientY;
                // Center paddle to finger
                player.y = touchY - player.height / 2;
                
                // Boundaries
                if (player.y < 0) player.y = 0;
                if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;
            }, { passive: false });
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            // Random initial direction
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 3 + 3);
        }

        function update() {
            // Player Movement via Keyboard
            if (keys.w || keys.ArrowUp) {
                player.y -= player.speed;
            }
            if (keys.s || keys.ArrowDown) {
                player.y += player.speed;
            }

            // Player Bounds
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;

            // CPU AI (Simple tracking)
            let cpuCenter = cpu.y + cpu.height / 2;
            if (cpuCenter < ball.y - 10) {
                cpu.y += cpu.speed;
            } else if (cpuCenter > ball.y + 10) {
                cpu.y -= cpu.speed;
            }

            // CPU Bounds
            if (cpu.y < 0) cpu.y = 0;
            if (cpu.y + cpu.height > canvas.height) cpu.y = canvas.height - cpu.height;

            // Ball Movement
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall Collisions (Top / Bottom)
            if (ball.y <= 0 || ball.y + ball.size >= canvas.height) {
                ball.dy *= -1;
            }

            // Paddle Collisions
            // Player Paddle
            if (ball.dx < 0) {
                if (ball.x <= player.x + player.width && 
                    ball.x + ball.size >= player.x &&
                    ball.y + ball.size >= player.y && 
                    ball.y <= player.y + player.height) {
                    
                    ball.dx *= -1;
                    // Add some english/spin based on where it hits
                    let hitPoint = (ball.y + ball.size/2) - (player.y + player.height/2);
                    ball.dy = hitPoint * 0.2;
                    ball.x = player.x + player.width; // Prevent sticking
                }
            } 
            // CPU Paddle
            else {
                if (ball.x + ball.size >= cpu.x && 
                    ball.x <= cpu.x + cpu.width &&
                    ball.y + ball.size >= cpu.y && 
                    ball.y <= cpu.y + cpu.height) {
                    
                    ball.dx *= -1;
                    let hitPoint = (ball.y + ball.size/2) - (cpu.y + cpu.height/2);
                    ball.dy = hitPoint * 0.2;
                    ball.x = cpu.x - ball.size; // Prevent sticking
                }
            }

            // Scoring
            if (ball.x < 0) {
                cpu.score++;
                resetBall();
            } else if (ball.x > canvas.width) {
                player.score++;
                resetBall();
            }
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center dashed line
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4;
            ctx.setLineDash([15, 15]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Reset

            // Draw Paddles
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillRect(cpu.x, cpu.y, cpu.width, cpu.height);

            // Draw Ball
            ctx.fillRect(ball.x, ball.y, ball.size, ball.size);

            // Draw Scores
            ctx.fillStyle = 'white';
            ctx.font = "40px 'Press Start 2P', Courier, monospace";
            ctx.textAlign = "center";
            ctx.fillText(player.score, canvas.width / 4, 80);
            ctx.fillText(cpu.score, 3 * canvas.width / 4, 80);
        }

        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
